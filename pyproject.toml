[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-guideline-tooling-eval"
version = "0.1.0"
description = "Research harness to evaluate LLM trustworthiness in selecting between real and sham guideline tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1",
    "tiktoken>=0.7",  # r2.audit.openai_tokens (o200k_base)
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",  # the GEE; the exact versions of the analysis are written into FREEZE_RECORD.md
    "matplotlib>=3.8",
    "python-docx>=1.1",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "r2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
